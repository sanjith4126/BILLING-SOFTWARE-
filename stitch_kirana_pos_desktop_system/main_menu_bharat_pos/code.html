<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bharat POS - Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#391303",

                      "surface-variant": "#e1e3e4",
                      "surface-dim": "#d9dadb",
                      "inverse-surface": "#2e3132",
                      "primary": "#000613",
                      "on-secondary-fixed-variant": "#3f484f",
                      "on-background": "#191c1d",
                      "on-error": "#ffffff",
                      "secondary-fixed-dim": "#bfc8d0",
                      "tertiary-fixed-dim": "#fdb69a",
                      "on-tertiary-fixed-variant": "#6b3a25",
                      "inverse-on-surface": "#f0f1f2",
                      "on-error-container": "#93000a",
                      "surface-tint": "#476083",
                      "secondary": "#575f67",
                      "surface": "#f8f9fa",
                      "primary-fixed-dim": "#afc8f0",
                      "secondary-fixed": "#dbe4ed",
                      "surface-container-high": "#e7e8e9",
                      "surface-container-highest": "#e1e3e4",

              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"

              "spacing": {
                      "xs": "4px",
                      "sm": "8px",
                      "gutter": "12px",
                      "lg": "24px",
                      "md": "16px",
                      "row-height": "32px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "label-sm": [
                              "Inter"
                      ],
                      "display-sm": [
                              "Inter"
                      ],
                      "data-sm": [

                      ],
                      "headline-sm": [

                      ],
                      "body-md": [

                      ]
              },
              "fontSize": {
                      "label-sm": [

                              "24px",

<body class="bg-background min-h-screen text-on-surface font-body-md overflow-hidden flex flex-col">
<!-- Top Navigation -->
<header class="fixed top-0 left-0 w-full h-row-height z-50 flex justify-between items-center px-gutter bg-primary-container border-b border-outline-variant text-on-primary-container font-headline-sm text-headline-sm font-label-sm text-label-sm">
<div class="flex items-center gap-sm">
<span class="font-headline-sm text-headline-sm font-bold text-on-primary-container">Bharat POS</span>
<span class="text-on-primary-container opacity-80 text-label-sm font-label-sm ml-md">Bharat Groceries</span>
</div>
<div class="flex items-center gap-lg">
<div class="flex items-center gap-sm">
<span class="text-label-sm font-label-sm text-on-primary-container opacity-80">Cashier: Arjun (Morning Shift)</span>
</div>
<div class="flex gap-sm">
<button class="hover:bg-primary opacity-90 transition-colors duration-150 p-1 rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-on-primary-container focus:ring-offset-2 focus:ring-offset-primary-container">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="hover:bg-primary opacity-90 transition-colors duration-150 p-1 rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-on-primary-container focus:ring-offset-2 focus:ring-offset-primary-container">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="hover:bg-primary opacity-90 transition-colors duration-150 p-1 rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-on-primary-container focus:ring-offset-2 focus:ring-offset-primary-container">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-row-height mb-row-height overflow-y-auto p-gutter bg-surface-bright flex justify-center items-center">
<div class="w-full max-w-7xl grid grid-cols-12 gap-gutter">
<!-- Group 1: Billing -->
<div class="col-span-12 md:col-span-4 lg:col-span-3 flex flex-col gap-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant pb-xs mb-xs">Billing</h2>
<button class="w-full bg-primary-container text-on-primary border border-outline-variant rounded-DEFAULT p-md flex flex-col items-start justify-between h-32 hover:border-primary-fixed focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all group">
<div class="flex justify-between w-full">
<span class="material-symbols-outlined text-display-sm group-hover:scale-110 transition-transform" data-icon="shopping_cart">shopping_cart</span>
<span class="bg-surface-variant text-on-surface-variant font-data-sm text-data-sm px-xs py-1 rounded-DEFAULT border border-outline-variant">[F2]</span>
</div>
<span class="font-headline-sm text-headline-sm mt-auto">New Sale</span>
</button>
</div>
<!-- Group 2: Stock -->
<div class="col-span-12 md:col-span-8 lg:col-span-5 flex flex-col gap-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant pb-xs mb-xs">Stock</h2>
<div class="grid grid-cols-2 gap-sm h-full">
<button class="bg-surface-container-lowest text-on-surface border border-outline-variant rounded-DEFAULT p-md flex flex-col items-start justify-between h-32 hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all group">
<span class="material-symbols-outlined text-display-sm text-primary group-hover:scale-110 transition-transform" data-icon="inventory_2">inventory_2</span>
<span class="font-label-sm text-label-sm mt-auto">Item Master</span>
</button>
<button class="bg-surface-container-lowest text-on-surface border border-outline-variant rounded-DEFAULT p-md flex flex-col items-start justify-between h-32 hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all group">
<span class="material-symbols-outlined text-display-sm text-primary group-hover:scale-110 transition-transform" data-icon="fact_check">fact_check</span>
<span class="font-label-sm text-label-sm mt-auto">Stock Take</span>
</button>
</div>
</div>
<!-- Group 3: Purchasing -->
<div class="col-span-12 md:col-span-4 lg:col-span-4 flex flex-col gap-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant pb-xs mb-xs">Purchasing</h2>
<button class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-DEFAULT p-md flex flex-col items-start justify-between h-32 hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all group">
<span class="material-symbols-outlined text-display-sm text-primary group-hover:scale-110 transition-transform" data-icon="add_shopping_cart">add_shopping_cart</span>
<span class="font-label-sm text-label-sm mt-auto">Purchase Entry</span>
</button>
</div>
<!-- Group 4: Customers & Credit -->
<div class="col-span-12 md:col-span-4 flex flex-col gap-sm mt-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant pb-xs mb-xs">Customers</h2>
<button class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-DEFAULT p-md flex flex-col items-start justify-between h-32 hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all group">
<span class="material-symbols-outlined text-display-sm text-primary group-hover:scale-110 transition-transform" data-icon="menu_book">menu_book</span>
<span class="font-label-sm text-label-sm mt-auto">Khata Ledger</span>
</button>
</div>
<!-- Group 5: Cash -->
<div class="col-span-12 md:col-span-4 flex flex-col gap-sm mt-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant pb-xs mb-xs">Cash</h2>
<button class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-DEFAULT p-md flex flex-col items-start justify-between h-32 hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all group">
<span class="material-symbols-outlined text-display-sm text-primary group-hover:scale-110 transition-transform" data-icon="point_of_sale">point_of_sale</span>
<span class="font-label-sm text-label-sm mt-auto">Day Close</span>
</button>
</div>
<!-- Group 6: Reports & Admin -->
<div class="col-span-12 md:col-span-4 flex flex-col gap-sm mt-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant pb-xs mb-xs">System</h2>
<div class="grid grid-cols-2 gap-sm h-full">
<button class="bg-surface-container-low text-on-surface-variant border border-outline-variant rounded-DEFAULT p-md flex flex-col items-center justify-center h-32 hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all group">
<span class="material-symbols-outlined text-display-sm mb-xs group-hover:scale-110 transition-transform" data-icon="assessment">assessment</span>
<span class="font-label-sm text-label-sm">Reports</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant border border-outline-variant rounded-DEFAULT p-md flex flex-col items-center justify-center h-32 hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all group">
<span class="material-symbols-outlined text-display-sm mb-xs group-hover:scale-110 transition-transform" data-icon="admin_panel_settings">admin_panel_settings</span>
<span class="font-label-sm text-label-sm">Admin</span>
</button>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-gutter bg-primary border-t border-primary h-row-height text-on-primary font-data-sm text-data-sm">
<div class="font-data-sm text-data-sm text-on-primary">[F1] Help | [F2] New Bill | [F5] Print | [F10] Close Day</div>
<div class="flex gap-md opacity-90 text-on-primary">
<span>System Status: Online</span>
<span>Station: POS-01</span>
</div>
</footer>
</body></html>
